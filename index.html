<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Exercises Webapp</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Monaco Editor CDN -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <!-- Pyodide for Python execution -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1>Coding Exercises</h1>
        <nav class="course-nav">
          <button id="prev-lesson" class="nav-btn">← Previous</button>
          <span id="lesson-title">Getting Started</span>
          <span id="lesson-counter" style="margin: 0 1rem; color: #666"
            >(1/4)</span
          >
          <button id="next-lesson" class="nav-btn">Next →</button>
        </nav>
      </header>

      <main class="main-content">
        <!-- Course Navigation Sidebar -->
        <div class="sidebar" id="course-sidebar">
          <div class="sidebar-header">
            <h3>Courses</h3>
          </div>
          <div class="sidebar-content" id="sidebar-content">
            <div class="loading">Loading courses...</div>
          </div>
        </div>

        <div class="content-area">
          <div class="chunk-navigation">
            <button
              id="prev-chunk"
              class="chunk-nav-btn"
              title="Previous section"
            >
              ←
            </button>
            <span
              id="chunk-counter"
              style="margin: 0 1rem; color: #666; font-weight: bold"
              >(1/1)</span
            >
            <button id="next-chunk" class="chunk-nav-btn" title="Next section">
              →
            </button>
          </div>
          <div class="lesson-content" id="lesson-content">
            <div class="loading">Loading lesson content...</div>
          </div>
        </div>

        <div
          class="resize-handle"
          id="resize-handle"
          title="Drag to resize columns"
        ></div>

        <div class="exercise-panel" id="exercise-panel">
          <div class="exercise-header">
            <h3 id="exercise-title">Editor</h3>
            <button id="run-code" class="run-btn">Run Code</button>
            <button id="check-exercise" class="check-btn">
              Check Solution
            </button>
          </div>
          <div class="exercise-content">
            <!-- Editor Tabs for HTML/CSS Course -->
            <div class="editor-tabs" id="editor-tabs" style="display: none">
              <button class="tab-btn active" data-tab="html">HTML</button>
              <button class="tab-btn" data-tab="css">CSS</button>
            </div>

            <div class="editor-container">
              <div id="code-editor">
                <div class="loading">Loading editor...</div>
              </div>
            </div>

            <!-- Live Preview Panel for HTML/CSS -->
            <div class="preview-panel" id="preview-panel" style="display: none">
              <div class="preview-header">
                <h4>Live Preview</h4>
                <button id="refresh-preview" class="refresh-btn">
                  ↻ Refresh
                </button>
              </div>
              <div class="preview-content">
                <iframe
                  id="preview-iframe"
                  sandbox="allow-scripts allow-same-origin"
                ></iframe>
              </div>
            </div>

            <div class="output-container">
              <h4>Output:</h4>
              <div id="exercise-output" class="output-box">
                Write some code and click "Run Code" to see the output here.
              </div>
              <h4>Expected Output:</h4>
              <div id="expected-output" class="expected-output-box">
                Expected output will be shown here when an exercise is selected.
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="markdown-parser.js"></script>
    <script src="code-executor.js"></script>
    <script src="course-manager.js"></script>
    <script src="app.js"></script>
  </body>
</html>
